<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Editor</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Edit your image</h2>

    <div id="drop-area">
      <p id="drop-text">Drag & Drop an image here or <span id="upload-btn">Browse</span></p>
      <input type="file" id="file-input" accept="image/*" />
      <canvas id="canvas"></canvas>
    </div>

    <div class="buttons">
      <button class="btn blue" onclick="enhanceImage()">Image Enhancer</button>
      <button class="btn teal" onclick="applyColorGrading()">Color Grading</button>
      <button class="btn purple" onclick="removeBackground()">Background Remover</button>
      <button class="btn green" onclick="downloadImage()">Download Image</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
